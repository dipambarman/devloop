# DevLoop Production Docker Compose Stack
# Runs: PHP 8.3-FPM + Nginx + MySQL 8.4 + Redis 7 + Queue Worker
# Usage: docker compose up -d --build

services:
  # ── PHP Application Server ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devloop-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php-production.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - devloop

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: devloop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - devloop

  # ── MySQL 8.4 Database ─────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: devloop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devloop
      MYSQL_USER: devloop_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-devloop_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devloop

  # ── Redis 7 (Cache, Sessions, Queues) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devloop-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devloop

  # ── Laravel Queue Worker ───────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devloop-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - ./docker/php/php-production.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devloop

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  devloop:
    driver: bridge
